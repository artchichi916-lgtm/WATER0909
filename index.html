<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f766e"><title>水措法規測驗｜415題</title><style>
:root{--p:#0f766e;--p2:#0b5f59;--text:#173033;--muted:#657679;--line:#d8e4e2;--good:#15803d;--goodbg:#effdf3;--bad:#dc2626;--badbg:#fff1f2;--card:#fff;--bg:#f4f8f7}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#edf8f6,#f7faf9 55%,#f4f7f7);font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--text);line-height:1.75}.wrap{max-width:1160px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:18px}.brand h1{margin:0;font-size:25px}.brand p{margin:0;color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:9px 13px;border:1px solid var(--line);background:#fff;border-radius:10px;font-weight:800;cursor:pointer}.btn.primary{background:var(--p);border-color:var(--p);color:#fff}.btn.danger{color:#991b1b;border-color:#fecaca}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:0 10px 30px rgba(15,118,110,.07)}.stat{padding:15px}.stat b{font-size:27px}.stat small{display:block;color:var(--muted)}.card{padding:20px;margin-bottom:18px}.hidden{display:none!important}.notice{padding:12px 14px;border-radius:10px;background:#fffbeb;border:1px solid #fde68a;color:#92400e}.setup{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:4px}.field label{font-size:13px;color:var(--muted);font-weight:800}.select{padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;min-width:160px}.prog{display:flex;align-items:center;gap:12px;margin-bottom:15px}.track{flex:1;height:10px;background:#e8efee;border-radius:99px;overflow:hidden}.track span{display:block;height:100%;background:var(--p)}.q{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px;margin:13px 0}.qhead{display:flex;justify-content:space-between;gap:10px}.qnum{font-weight:900;color:var(--p)}.tag{font-size:12px;background:#e8f5f3;color:#11665f;padding:2px 8px;border-radius:99px;font-weight:800}.stem{font-size:17px;font-weight:750;margin:10px 0}.opt{display:flex;gap:9px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin:8px 0;cursor:pointer}.opt:hover{border-color:#97c0bc;background:#fbfffe}.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;bottom:12px;padding:11px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:13px;box-shadow:0 10px 30px rgba(0,0,0,.07)}.resultTop{display:grid;grid-template-columns:1fr 2fr;gap:15px}.scorebox{text-align:center;padding:20px;border:1px solid var(--line);border-radius:13px;background:#f1fbf9}.score{font-size:55px;line-height:1;font-weight:900;color:var(--p)}.analysis{display:grid;grid-template-columns:1fr 1fr;gap:16px}.barrow{margin:10px 0}.barrow .meta{display:flex;justify-content:space-between;font-size:13px;font-weight:800}.bar{height:9px;background:#eef2f2;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:var(--p)}.review{border:1px solid var(--line);border-radius:13px;padding:15px;margin:12px 0}.review.good{border-color:#86efac;background:var(--goodbg)}.review.bad{border-color:#fda4af;background:var(--badbg)}.answer{padding:7px 9px;background:rgba(255,255,255,.8);border-radius:8px;margin:6px 0}.goodtxt{color:var(--good);font-weight:900}.badtxt{color:var(--bad);font-weight:900}.footer{text-align:center;color:var(--muted);font-size:12px;padding:3px 0 25px}@media(max-width:900px){.cards{grid-template-columns:1fr 1fr}.resultTop,.analysis{grid-template-columns:1fr}}@media(max-width:600px){.wrap{padding:12px}.top{align-items:flex-start;flex-direction:column}.brand h1{font-size:21px}.nav{position:static}.stem{font-size:16px}}
</style></head><body><div class="wrap"><header class="top"><div class="brand"><h1>水措許可申請與檢測申報｜測驗網站</h1><p>完整 415 題・每回 40 題・錯題循環學習</p></div><div class="actions"><button class="btn" id="exp">備份紀錄</button><button class="btn" id="imp">匯入紀錄</button><input class="hidden" id="file" type="file" accept="application/json"><button class="btn danger" id="reset">重置進度</button></div></header><section class="cards" id="dash"></section><section class="card" id="setup"><h2 style="margin-top:0">開始測驗</h2><div class="notice" id="status"></div><div class="setup" style="margin-top:14px"><div class="field"><label>本次題數</label><select id="size" class="select"><option value="40" selected>40 題</option><option value="20">20 題</option><option value="10">10 題</option></select></div><button class="btn primary" id="start">開始測驗</button></div><div style="color:var(--muted);font-size:13px;margin-top:12px">出題順序：優先錯題，再補尚未答對的新題；答對後永久移出後續測驗。</div></section><section id="quiz" class="hidden"><div class="prog"><div class="track"><span id="pb" style="width:0"></span></div><b id="pt">0 / 40</b></div><form id="form"></form><div class="nav"><span id="hint" style="color:var(--muted);font-size:13px"></span><button type="button" class="btn primary" id="submit">交卷並計算成績</button></div></section><section id="result" class="hidden"><div class="card resultTop"><div class="scorebox"><div class="score" id="score">0</div><div>本次得分</div><small id="detail" style="color:var(--muted)"></small></div><div><h2 style="margin-top:0">答題情況分析</h2><div id="summary"></div></div></div><div class="card"><h2 style="margin-top:0">弱項與加強建議</h2><div class="analysis"><div id="bars"></div><div id="tips"></div></div></div><div class="card"><h2 style="margin-top:0">考題＋答案</h2><div id="reviews"></div></div><div class="card" style="text-align:center"><button class="btn primary" id="next">進行下一回測驗</button></div></section><div class="footer">題庫：Water_Pollution_Regulations_Question_Bank_Full(1).md｜進度保存在此瀏覽器 localStorage</div></div><script src="questions.js"></script><script>
const BANK=window.QUESTION_BANK||[],KEY='waterQuiz415StateV2';let state=load(),current=[],last=null;const $=x=>document.getElementById(x);function def(){return{correct:[],wrong:[],attempts:0,history:[],lastAt:null}}function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&Array.isArray(s.correct)&&Array.isArray(s.wrong))return s}catch(e){}return def()}function save(){localStorage.setItem(KEY,JSON.stringify(state));dash()}function uniq(a){return[...new Set(a.map(String))]}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function dash(){let c=new Set(state.correct),w=new Set(state.wrong);$('dash').innerHTML=stat(c.size,'已答對（不再出題）')+stat(w.size,'待複習錯題')+stat(BANK.length-c.size,'剩餘可出題')+stat(state.attempts,'完成測驗次數');$('status').textContent=BANK.length-c.size?`目前還有 ${BANK.length-c.size} 題尚未答對，其中 ${w.size} 題為錯題；下一回優先安排錯題。`:'415 題全部答對，恭喜完成題庫！可重置後重新練習。'}function stat(n,l){return`<div class="stat"><b>${n}</b><small>${l}</small></div>`}function pick(n){let c=new Set(state.correct),w=new Set(state.wrong),eligible=BANK.filter(q=>!c.has(q.id)),wrong=shuffle(eligible.filter(q=>w.has(q.id))),fresh=shuffle(eligible.filter(q=>!w.has(q.id)));return shuffle(wrong.slice(0,n).concat(fresh.slice(0,Math.max(0,n-wrong.length))))}function start(){let n=Math.min(Number($('size').value)||40,BANK.length-state.correct.length);if(n<=0){alert('目前沒有尚未答對的題目。');return}current=pick(n);$('form').innerHTML=current.map(q=>`<article class="q"><div class="qhead"><div class="qnum">第 ${q.number} 題</div><span class="tag">${esc(q.topic)}</span></div><div class="stem">${esc(q.stem)}</div>${q.options.map((o,i)=>`<label class="opt"><input type="radio" name="q${q.id}" value="${i+1}"><span>(${i+1}) ${esc(o)}</span></label>`).join('')}</article>`).join('');$('setup').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');update();scrollTo(0,0)}function update(){let a=current.filter(q=>document.querySelector(`input[name=q${q.id}]:checked`)).length;$('pt').textContent=`${a} / ${current.length}`;$('pb').style.width=(a/current.length*100)+'%';$('hint').textContent=a===current.length?'已全部作答，可以交卷。':`尚有 ${current.length-a} 題未作答`};function submit(){let rs=current.map(q=>{let x=document.querySelector(`input[name=q${q.id}]:checked`);let u=x?+x.value:null;return{q,user:u,ok:u===q.answer}}),miss=rs.filter(x=>x.user===null).length;if(miss&&!confirm(`還有 ${miss} 題未作答，確定交卷嗎？`))return;let c=new Set(state.correct),w=new Set(state.wrong);rs.forEach(r=>r.ok?(c.add(r.q.id),w.delete(r.q.id)):c.has(r.q.id)||w.add(r.q.id));state.correct=uniq([...c]);state.wrong=uniq([...w]);state.attempts++;state.lastAt=new Date().toISOString();state.history.push({at:state.lastAt,total:rs.length,correct:rs.filter(r=>r.ok).length,wrong:rs.filter(r=>!r.ok).length});if(state.history.length>50)state.history=state.history.slice(-50);save();last=rs;$('quiz').classList.add('hidden');renderResult();$('result').classList.remove('hidden');scrollTo(0,0)}function renderResult(){let right=last.filter(r=>r.ok).length,total=last.length,rate=right/total;$('score').textContent=Math.round(rate*100)+'分';$('detail').textContent=`答對 ${right} 題｜答錯 ${total-right} 題｜共 ${total} 題`;$('summary').innerHTML=rate>=.9?'<p><b>表現很好。</b>優先維持錯題複習即可。</p>':rate>=.75?'<p><b>整體穩定。</b>建議再次複習本次錯題與弱項主題。</p>':rate>=.6?'<p><b>還有加強空間。</b>特別注意法定期限、數字與申報條件。</p>':'<p><b>建議集中複習。</b>先重新閱讀本次錯題，再做下一回測驗。</p>';let t={};last.forEach(r=>{t[r.q.topic]??={n:0,w:0};t[r.q.topic].n++;if(!r.ok)t[r.q.topic].w++});let rows=Object.entries(t).sort((a,b)=>b[1].w/b[1].n-a[1].w/a[1].n);$('bars').innerHTML=rows.map(([k,v])=>{let ac=Math.round((v.n-v.w)/v.n*100);return`<div class="barrow"><div class="meta"><span>${esc(k)}</span><span>${ac}%（${v.w}/${v.n}錯）</span></div><div class="bar"><span style="width:${ac}%"></span></div></div>`}).join('');let weak=rows.filter(x=>x[1].w).slice(0,3);$('tips').innerHTML=weak.length?weak.map(([k,v])=>`<p>🔎 <b>${esc(k)}</b>：錯 ${v.w} 題。建議把相關的條件、期限、數字與申報規定整理成自己的重點筆記，再用下一回驗證。</p>`).join(''):'<p class="goodtxt">本次沒有錯題，繼續保持！</p>';$('reviews').innerHTML=last.map(r=>`<article class="review ${r.ok?'good':'bad'}"><div class="qhead"><b>第 ${r.q.number} 題</b><b class="${r.ok?'goodtxt':'badtxt'}">${r.ok?'✓ 答對':'✗ 答錯'}</b></div><span class="tag">${esc(r.q.topic)}</span><div class="stem">${esc(r.q.stem)}</div>${r.q.options.map((o,i)=>`<div class="answer ${i+1===r.q.answer?'goodtxt':''} ${r.user===i+1&&!r.ok?'badtxt':''}">(${i+1}) ${esc(o)} ${i+1===r.q.answer?' ← 正確答案':''}${r.user===i+1&&!r.ok?' ← 你的答案':''}</div>`).join('')}<div style="margin-top:8px;font-size:13px">正確答案：<b class="goodtxt">(${r.q.answer}) ${esc(r.q.options[r.q.answer-1])}</b></div></article>`).join('')};$('start').onclick=start;$('submit').onclick=submit;$('form').addEventListener('change',update);$('next').onclick=()=>{$('result').classList.add('hidden');$('setup').classList.remove('hidden');scrollTo(0,0)};$('reset').onclick=()=>{if(confirm('確定清除全部進度嗎？')){state=def();save()}};$('exp').onclick=()=>{let b=new Blob([JSON.stringify({version:2,state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='water_quiz_progress_backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('imp').onclick=()=>$('file').click();$('file').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.state)throw 0;state=x.state;save();alert('紀錄已匯入。')}catch(e){alert('匯入失敗，請選擇本網站產生的 JSON 備份檔。')}};r.readAsText(f);e.target.value=''};dash();
</script></body></html>
